<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Background (Android Squircle / Mask friendly) -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />

  <!-- Subtle Inspection Radar Circles in Background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3" />

  <!-- Shield Shape Container -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Border -->
    <path d="M 256 95 L 380 145 C 380 270 295 365 256 395 C 217 365 132 270 132 145 Z" 
          fill="url(#shield-grad)" 
          stroke="#93c5fd" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Inner Shield Accent Rim -->
    <path d="M 256 115 L 362 158 C 362 260 290 345 256 372 C 222 345 150 260 150 158 Z" 
          fill="#172554" 
          opacity="0.65" />

    <!-- Geotag Target Pin / Crosshair / Inspection Symbol -->
    <circle cx="256" cy="210" r="38" fill="none" stroke="#60a5fa" stroke-width="6" />
    <circle cx="256" cy="210" r="14" fill="#fbbf24" />
    
    <!-- Crosshairs -->
    <line x1="256" y1="160" x2="256" y2="185" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <line x1="256" y1="235" x2="256" y2="260" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <line x1="206" y1="210" x2="231" y2="210" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <line x1="281" y1="210" x2="306" y2="210" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />

    <!-- Verification Checkmark -->
    <path d="M 205 285 L 242 320 L 315 245" 
          fill="none" 
          stroke="#22c55e" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Gold Stars for Official MoSJE Emblem Feel -->
    <polygon points="256,128 261,141 275,141 264,150 268,163 256,155 244,163 248,150 237,141 251,141" fill="url(#accent-grad)" />
  </g>

  <!-- Text / Monogram Bottom Label -->
  <text x="256" y="445" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#ffffff" 
        text-anchor="middle">TRACPORT</text>
  <text x="256" y="475" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#93c5fd" 
        text-anchor="middle">MoSJE INSPECTION</text>
</svg>
